name: DSBot
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# 包名和签名团队在 Config/Shared.xcconfig（可用不入库的 Config/Local.xcconfig 覆盖）
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  DSBot:
    type: application
    platform: iOS
    sources:
      - DSBot
    info:
      path: DSBot/Info.plist
      properties:
        CFBundleDisplayName: DS Bot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: DS Bot 需要访问局域网里的服务器。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DSBOT_BUNDLE_ID)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  DSBotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DSBotUITests
    dependencies:
      - target: DSBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DSBOT_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DSBot
schemes:
  DSBot:
    build:
      targets:
        DSBot: all
    test:
      targets:
        - DSBotUITests
